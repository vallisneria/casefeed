stages:
  - build

build-job:
  stage: build
  image: "docker:28.0.4"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - make build-all
    - make push-all

build-release:
  stage: build
  image: "docker:28.0.4"
  only:
    - tags
  script:
    - echo "test"
