stages:
  - build

build-job:
  stage: build
  image: "docker:28.0.4"
  services:
    - name: "docker:28.0.4-dind"
      alias: docker
  rules:
    - changes:
        - "**/src/**"
        - "**/Dockefile"
        - "**/Cargo.*"
        - Cargo.*
      when: always
  before_script:
    - apk add --no-cache make
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - make build-all
    - make push-all

build-release:
  stage: build
  image: "docker:28.0.4"
  services:
    - name: "docker:28.0.4-dind"
      alias: docker
  only:
    - tags
  variables:
    RELEASE_TAG: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache make
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - make build-release-all
    - make push-release-all
