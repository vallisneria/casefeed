[workspace]
members = ["court-crawler", "casefeed-web", "court-api", "ccourt-crawler", "db"]
resolver = "2"

[workspace.dependencies]
axum = "0.8.1"
chrono = { version = "0.4", features = ["serde"] }
court-api = { path = "./court-api", features = ["sqlx"] }
db = { path = "./db" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rss = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "derive",
    "macros",
] }
thiserror = "2"
tokio = { version = "1.42.0", features = ["full"] }
url = { version = "2", features = ["serde"] }
