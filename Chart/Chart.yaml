apiVersion: v2
name: casefeed
description: 법원/헌법재판소 판례공보를 RSS로 제공하는 서비스
type: application
version: 1.0.1
home: https://gitlab.com/vallisneria/casefeed

dependencies:
  - name: postgresql
    version: "16.5"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  - name: cloudflare-tunnel
    version: "0.3.2"
    repository: https://cloudflare.github.io/helm-charts
    condition: cloudflare-tunnel.enabled
